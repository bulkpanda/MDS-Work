<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDS 2026 — Python Call Graph Explorer</title>
<style>
:root{
  color-scheme: light;
  --surface-0:#f5f4f1; --surface-1:#fcfcfb; --surface-2:#efeeea;
  --line:#dedcd6; --line-strong:#c4c1b8;
  --text-1:#0b0b0b; --text-2:#52514e; --text-3:#84827a;
  --focus:#2a78d6;      /* selected */
  --up:#eb6834;         /* callers / upstream */
  --down:#1baf7a;       /* callees / downstream */
  --dim:#b6b3aa;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --navy:#010d44;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-0:#111110; --surface-1:#1a1a19; --surface-2:#242422;
    --line:#343430; --line-strong:#4a4a45;
    --text-1:#ffffff; --text-2:#c3c2b7; --text-3:#8d8b80;
    --focus:#3987e5; --up:#d95926; --down:#199e70; --dim:#5a5852;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-0:#111110; --surface-1:#1a1a19; --surface-2:#242422;
  --line:#343430; --line-strong:#4a4a45;
  --text-1:#ffffff; --text-2:#c3c2b7; --text-3:#8d8b80;
  --focus:#3987e5; --up:#d95926; --down:#199e70; --dim:#5a5852;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--surface-0);color:var(--text-1);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--surface-1);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
header h1 span{color:var(--text-3);font-weight:400}
.kpis{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;line-height:1.15}
.kpi b{font-size:15px;font-variant-numeric:tabular-nums;font-weight:650}
.kpi small{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:2px;border-radius:7px}
.tabs button{background:none;border:0;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:12.5px;color:var(--text-2)}
.tabs button[aria-selected=true]{background:var(--surface-1);color:var(--text-1);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.iconbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--text-2)}
.iconbtn:hover{border-color:var(--line-strong);color:var(--text-1)}

.body{display:grid;grid-template-columns:250px 1fr 340px;overflow:hidden;min-height:0}
@media (max-width:1100px){.body{grid-template-columns:210px 1fr}.detail{display:none}}
aside,.detail{background:var(--surface-1);overflow-y:auto;min-height:0}
aside{border-right:1px solid var(--line)}
.detail{border-left:1px solid var(--line)}
main{position:relative;overflow:hidden;min-height:0;background:var(--surface-0)}

/* ---------- sidebar ---------- */
.pad{padding:12px 14px}
.srch{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-0);color:var(--text-1);font-size:13px;font-family:var(--mono)}
.srch:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
.secttl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:650;padding:12px 14px 5px}
.band{padding:0 8px 4px}
.bandttl{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:650;color:var(--text-2);padding:8px 6px 4px}
.bandttl i{width:3px;height:12px;border-radius:2px;background:var(--dim);display:inline-block}
.mrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 6px;border-radius:5px;cursor:pointer}
.mrow:hover{background:var(--surface-2)}
.mrow[aria-current=true]{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--focus)}
.mrow .nm{font-family:var(--mono);font-size:11.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .ct{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.results{padding:2px 8px 10px}
.res{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 7px;border-radius:5px;cursor:pointer}
.res:hover{background:var(--surface-2)}
.res .fn{font-family:var(--mono);font-size:11.5px;color:var(--text-1);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .md{font-size:10px;color:var(--text-3)}
mark{background:rgba(42,120,214,.22);color:inherit;border-radius:2px}

/* ---------- canvas ---------- */
#cv{display:block;width:100%;height:100%;cursor:grab}
#cv.drag{cursor:grabbing}
.overlay{position:absolute;left:14px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 28px)}
.chip{background:var(--surface-1);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.chip b{color:var(--text-1);font-family:var(--mono);font-weight:600}
.legend{position:absolute;right:14px;bottom:14px;background:var(--surface-1);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11.5px}
.legend div{display:flex;align-items:center;gap:7px;margin:3px 0;color:var(--text-2)}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.hint{position:absolute;left:14px;bottom:14px;font-size:11px;color:var(--text-3);background:var(--surface-1);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface-1);border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;font-size:11.5px;max-width:400px;box-shadow:0 6px 24px rgba(0,0,0,.16);display:none}
#tip .t{font-family:var(--mono);font-size:11.5px;color:var(--text-1);word-break:break-all}
#tip .s{color:var(--text-3);margin-top:3px}

/* ---------- module map ---------- */
.map{padding:18px 22px;overflow-y:auto;height:100%}
.layer{margin-bottom:20px}
.layerh{display:flex;align-items:center;gap:9px;margin:0 0 9px;font-size:12px;font-weight:650;letter-spacing:.02em;color:var(--text-2)}
.layerh i{width:4px;height:15px;border-radius:2px;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--focus)}
.card h4{margin:0 0 7px;font-family:var(--mono);font-size:12.5px;font-weight:600;word-break:break-all}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-bottom:7px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--focus)}
.meta{display:flex;gap:11px;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.meta b{color:var(--text-2);font-weight:600}
.tag{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:9px;border:1px solid var(--line-strong);color:var(--text-3);margin-top:7px;margin-right:4px}
.tag.e{border-color:var(--focus);color:var(--focus)}

/* ---------- detail ---------- */
.detail h3{margin:0 0 3px;font-family:var(--mono);font-size:13px;font-weight:650;word-break:break-all}
.sig{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 9px;white-space:pre-wrap;word-break:break-word;color:var(--text-2);margin:9px 0}
.dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11.5px;margin:9px 0}
.dl dt{color:var(--text-3)}
.dl dd{margin:0;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11px;word-break:break-all}
.lst{margin:5px 0 0;padding:0;list-style:none}
.lst li{padding:3px 0;border-bottom:1px solid var(--line)}
.lst li:last-child{border:0}
.lnk{background:none;border:0;padding:0;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--text-1);text-align:left;word-break:break-all}
.lnk:hover{text-decoration:underline;text-decoration-color:var(--focus)}
.lnk .m{color:var(--text-3)}
.empty{color:var(--text-3);font-size:11.5px;font-style:italic}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--line-strong);color:var(--text-2);margin:0 4px 4px 0}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ---------- table view ---------- */
.tablewrap{padding:16px 20px;overflow:auto;height:100%}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--surface-1);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:650;z-index:2;cursor:pointer;white-space:nowrap}
th:hover{color:var(--text-1)}
td.mono{font-family:var(--mono);font-size:11px}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
tbody tr:hover{background:var(--surface-2)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>MDS 2026 <span>· Python call graph</span></h1>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-map" aria-selected="true">Module map</button>
    <button role="tab" id="t-graph" aria-selected="false">Call graph</button>
    <button role="tab" id="t-table" aria-selected="false">Table</button>
  </div>
  <button class="iconbtn" id="theme">◐ Theme</button>
  <div class="kpis">
    <div class="kpi"><b>20</b><small>modules</small></div>
    <div class="kpi"><b id="k-loc">—</b><small>lines</small></div>
    <div class="kpi"><b id="k-fn">—</b><small>functions</small></div>
    <div class="kpi"><b id="k-edge">—</b><small>call edges</small></div>
    <div class="kpi"><b id="k-entry">—</b><small>notebook entry pts</small></div>
  </div>
</header>

<div class="body">
  <aside>
    <div class="pad"><input class="srch" id="q" placeholder="Search functions…" autocomplete="off" spellcheck="false"></div>
    <div id="searchbox" class="hide"><div class="secttl">Matches (<span id="nres">0</span>)</div><div class="results" id="results"></div></div>
    <div id="modbox">
      <div class="secttl">Modules</div>
      <div id="modlist"></div>
    </div>
  </aside>

  <main>
    <div id="pane-graph" class="hide" style="position:absolute;inset:0">
      <canvas id="cv"></canvas>
      <div class="overlay">
        <div class="chip">Scope <b id="scope">Utils</b></div>
        <button class="iconbtn" id="btn-all">Show all modules</button>
        <button class="iconbtn" id="btn-fit">Fit</button>
        <label class="chip"><input type="checkbox" id="cb-orphan"> show unconnected</label>
      </div>
      <div class="legend" id="lg">
        <div><i style="background:var(--focus)"></i> selected</div>
        <div><i style="background:var(--up)"></i> calls it (upstream)</div>
        <div><i style="background:var(--down)"></i> it calls (downstream)</div>
        <div><i style="background:var(--dim)"></i> other · ▢ = notebook entry point</div>
      </div>
      <div class="hint">drag to pan · scroll to zoom · click a node to focus</div>
    </div>
    <div id="pane-map" class="map"></div>
    <div id="pane-table" class="tablewrap hide"></div>
  </main>

  <div class="detail pad" id="detail"></div>
</div>
</div>

    notebook <code style="font-family:var(--mono)">main.ipynb</code> calls into. Click a module to open its call graph.</p>`;
  LAYER_ORDER.forEach(layer=>{
    const ms = MODS.filter(m=>m.layer===layer).sort((a,b)=>b.loc-a.loc);
    if(!ms.length) return;
    html += `<section class="layer"><h3 class="layerh"><i style="background:${LAYER_HUE[layer]}"></i>${ms[0].layerName} <span style="color:var(--text-3);font-weight:400">· ${ms.length} module${ms.length>1?'s':''}</span></h3><div class="cards">`;
    ms.forEach(m=>{
      const deps = m.localImports.length ? m.localImports.map(d=>`<span class="tag">→ ${d}</span>`).join('') : '';
      const ep = m.entryPoints.length ? `<span class="tag e">${m.entryPoints.length} notebook entry pt${m.entryPoints.length>1?'s':''}</span>` : '';
      html += `<button class="card" data-mod="${m.id}" ${m.entryPoints.length?'style="border-color:var(--focus)"':''}>
        <h4>${m.id}.py</h4>
        <div class="bar"><i style="width:${Math.round(100*m.loc/maxLoc)}%"></i></div>
        <div class="meta"><span><b>${m.loc.toLocaleString()}</b> loc</span><span><b>${m.funcs}</b> fn</span>${m.classes?`<span><b>${m.classes}</b> cls</span>`:''}${m.consts?`<span><b>${m.consts}</b> const</span>`:''}</div>
        <div>${ep}${deps}</div></button>`;
    });
    html += `</div></section>`;
  });
  paneMap.innerHTML = html;
  paneMap.querySelectorAll('.card').forEach(c=>c.onclick=()=>{ selectModule(c.dataset.mod,true); showTab('graph'); });
})();

/* ---------------- table view ---------------- */
const paneTable = document.getElementById('pane-table');
let sortKey='mod', sortDir=1;
function renderTable(){
  const rows = N.map((n,i)=>({i,mod:n.mod,name:n.name,line:n.line,loc:n.loc,inn:n.in,out:n.out,entry:n.entry,sig:n.sig}));
  rows.sort((a,b)=>{ const x=a[sortKey],y=b[sortKey];
    if(typeof x==='number') return (x-y)*sortDir;
    if(typeof x==='boolean') return ((x?1:0)-(y?1:0))*sortDir;
    return String(x).localeCompare(String(y))*sortDir; });
  const cols=[['mod','Module'],['name','Function'],['line','Line'],['loc','LOC'],['inn','Called by'],['out','Calls'],['entry','Notebook']];
  let h=`<p style="color:var(--text-2);font-size:12.5px;margin:0 0 12px">All ${N.length} function definitions. Click a header to sort; click a row to open it in the graph.</p><table><thead><tr>`;
  cols.forEach(([k,lbl])=>h+=`<th data-k="${k}">${lbl}${sortKey===k?(sortDir>0?' ▲':' ▼'):''}</th>`);
  h+=`<th>Signature</th></tr></thead><tbody>`;
  rows.forEach(r=>{ h+=`<tr data-i="${r.i}"><td class="mono">${r.mod}</td><td class="mono">${r.name}</td>
    <td class="num">${r.line}</td><td class="num">${r.loc}</td><td class="num">${r.inn}</td><td class="num">${r.out}</td>
    <td>${r.entry?'✓':''}</td><td class="mono" style="color:var(--text-3)">${esc(r.sig).slice(0,120)}</td></tr>`; });
  paneTable.innerHTML=h+`</tbody></table>`;
  paneTable.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(k===sortKey) sortDir*=-1; else {sortKey=k;sortDir=1;} renderTable(); });
  paneTable.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>{ focusNode(+tr.dataset.i); showTab('graph'); });
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------- graph state ---------------- */
let scopeMods = ['Utils'];
let visible = [];          // node indices in view
let pos = new Map();       // i -> {x,y,vx,vy}
let sel = -1, hover = -1;
let tx=0, ty=0, k=1;
let hideOrphan = true;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
let layoutW = 0, layoutH = 0, dirty = true;
function resize(){
  const r = cv.getBoundingClientRect(); DPR = Math.min(devicePixelRatio||1,2);
  if(r.width < 40 || r.height < 40) return;           // pane hidden — don't lay out at zero size
  W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  if(dirty || Math.abs(W-layoutW) > 80 || Math.abs(H-layoutH) > 80){ layout(); dirty=false; }
  else draw();
}
new ResizeObserver(resize).observe(cv);

function buildView(){
  const set = new Set();
  scopeMods.forEach(m => (byMod[m]||[]).forEach(i=>set.add(i)));
  // pull in cross-module neighbours of scoped nodes
  if(scopeMods.length < MODS.length){
    [...set].forEach(i=>{ outAdj[i].forEach(j=>set.add(j)); inAdj[i].forEach(j=>set.add(j)); });
  }
  visible = [...set];
  if(hideOrphan) visible = visible.filter(i=>N[i].in+N[i].out>0);
  if(W < 40 || H < 40){ dirty = true; return; }        // defer until the pane is visible
  layout(); dirty = false;
}

function layout(){
  if(W < 40 || H < 40){ dirty = true; return; }
  layoutW = W; layoutH = H;
  // seed: cluster by module on a ring, then relax
  const mods=[...new Set(visible.map(i=>N[i].mod))];
  const cx=W/2, cy=H/2, R=Math.min(W,H)*0.32;
  const centers={};
  mods.forEach((m,j)=>{ const a = mods.length===1 ? 0 : (j/mods.length)*Math.PI*2 - Math.PI/2;
    centers[m] = mods.length===1 ? {x:cx,y:cy} : {x:cx+Math.cos(a)*R, y:cy+Math.sin(a)*R}; });
  pos = new Map();
  const seen={};
  visible.forEach(i=>{
    const m=N[i].mod, c=centers[m]; const t=(seen[m]=(seen[m]||0)+1);
    const rr = 18*Math.sqrt(t), aa = t*2.399963;
    pos.set(i,{x:c.x+Math.cos(aa)*rr, y:c.y+Math.sin(aa)*rr, vx:0, vy:0});
  });
  // force relax
  const vis=new Set(visible);
  const edges = L.filter(l=>vis.has(l.s)&&vis.has(l.t));
  const n = visible.length;
  const iters = n>320?170:(n>120?230:300);
  for(let it=0; it<iters; it++){
    const alpha = 1 - it/iters;
    // repulsion (grid-bucketed)
    const cell=64, grid=new Map();
    visible.forEach(i=>{ const p=pos.get(i); const gk=(Math.floor(p.x/cell))+','+(Math.floor(p.y/cell));
      (grid.get(gk)||grid.set(gk,[]).get(gk)).push(i); });
    visible.forEach(i=>{
      const p=pos.get(i); const gx=Math.floor(p.x/cell), gy=Math.floor(p.y/cell);
      for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++){
        const bucket=grid.get((gx+a)+','+(gy+b)); if(!bucket) continue;
        for(const j of bucket){ if(j===i) continue; const q=pos.get(j);
          let dx=p.x-q.x, dy=p.y-q.y, d2=dx*dx+dy*dy;
          if(d2<1){ dx=(Math.random()-.5); dy=(Math.random()-.5); d2=1; }
          if(d2<5200){ const f=460/d2*alpha; p.vx+=dx*f; p.vy+=dy*f; }
        }
      }
    });
    // springs
    edges.forEach(l=>{ const p=pos.get(l.s), q=pos.get(l.t);
      const dx=q.x-p.x, dy=q.y-p.y, d=Math.hypot(dx,dy)||1;
      const want = l.cross?110:62;
      const f=(d-want)/d*0.055*alpha;
      p.vx+=dx*f; p.vy+=dy*f; q.vx-=dx*f; q.vy-=dy*f; });
    // module cohesion + centring
    visible.forEach(i=>{ const p=pos.get(i), c=centers[N[i].mod];
      p.vx+=(c.x-p.x)*0.012*alpha; p.vy+=(c.y-p.y)*0.012*alpha;
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.80; p.vy*=0.80; });
  }
  fit();
}

function fit(){
  if(!visible.length || W < 40 || H < 40) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  visible.forEach(i=>{const p=pos.get(i); x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});
  const pad=80, w=(x1-x0)||1, h=(y1-y0)||1;
  k = Math.max(0.15, Math.min((W-pad*2)/w, (H-pad*2)/h, 2.6));
  tx = W/2 - ((x0+x1)/2)*k; ty = H/2 - ((y0+y1)/2)*k;
  draw();
}

function nodeR(i){ const n=N[i]; return 3.2 + Math.min(7, Math.sqrt(n.in+n.out)*1.7) + (n.entry?1.2:0); }

function draw(){
  ctx.clearRect(0,0,W,H);
  if(!visible.length) return;
  const vis=new Set(visible);
  const up = sel>=0 ? new Set(inAdj[sel]) : new Set();
  const dn = sel>=0 ? new Set(outAdj[sel]) : new Set();
  const hi = hover>=0 ? hover : sel;
  const C = { focus:css.g('--focus'), up:css.g('--up'), dn:css.g('--down'), dim:css.g('--dim'),
              line:css.g('--line'), lineS:css.g('--line-strong'), t1:css.g('--text-1'),
              t2:css.g('--text-2'), t3:css.g('--text-3'), s1:css.g('--surface-1'), s0:css.g('--surface-0') };
  ctx.save(); ctx.translate(tx,ty); ctx.scale(k,k);

  // edges
  L.forEach(l=>{
    if(!vis.has(l.s)||!vis.has(l.t)) return;
    const a=pos.get(l.s), b=pos.get(l.t);
    let col=C.line, wid=0.7, alpha=1;
    if(sel>=0){
      if(l.t===sel){ col=C.up; wid=1.7; }
      else if(l.s===sel){ col=C.dn; wid=1.7; }
      else { alpha=0.28; }
    }
    ctx.globalAlpha=alpha; ctx.strokeStyle=col; ctx.lineWidth=wid/k;
    ctx.beginPath();
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y;
    ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(mx-dy*0.09, my+dx*0.09, b.x,b.y); ctx.stroke();
    // arrow head on highlighted edges
    if(sel>=0 && (l.s===sel||l.t===sel)){
      const ang=Math.atan2(b.y-a.y,b.x-a.x), r=nodeR(l.t)+2.5;
      const hx=b.x-Math.cos(ang)*r, hy=b.y-Math.sin(ang)*r, s=5/k;
      ctx.fillStyle=col; ctx.beginPath();
      ctx.moveTo(hx,hy);
      ctx.lineTo(hx-Math.cos(ang-0.42)*s, hy-Math.sin(ang-0.42)*s);
      ctx.lineTo(hx-Math.cos(ang+0.42)*s, hy-Math.sin(ang+0.42)*s);
      ctx.closePath(); ctx.fill();
    }
  });
  ctx.globalAlpha=1;

  // nodes
  visible.forEach(i=>{
    const p=pos.get(i), n=N[i], r=nodeR(i);
    let col=C.dim, a=1;
    if(i===sel) col=C.focus;
    else if(up.has(i)) col=C.up;
    else if(dn.has(i)) col=C.dn;
    else if(sel>=0) a=0.42;
    ctx.globalAlpha=a;
    ctx.beginPath();
    if(n.entry){ const s=r*1.05; ctx.rect(p.x-s,p.y-s,s*2,s*2); }
    else ctx.arc(p.x,p.y,r,0,6.284);
    ctx.fillStyle=col; ctx.fill();
    ctx.lineWidth=2/k; ctx.strokeStyle=C.s0; ctx.stroke();   // 2px surface ring
    if(i===hi){ ctx.lineWidth=2/k; ctx.strokeStyle=C.t1; ctx.beginPath(); ctx.arc(p.x,p.y,r+3.5,0,6.284); ctx.stroke(); }
    ctx.globalAlpha=1;
  });

  // labels — priority ordered, with collision avoidance so dense clusters stay readable
  const MONO=getComputedStyle(document.body).getPropertyValue('--mono');
  ctx.font=`${11/k}px ${MONO}`;
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  const prio=i=>{ const n=N[i];
    if(i===sel) return 0; if(i===hover) return 1;
    if(up.has(i)||dn.has(i)) return 2;
    if(n.entry) return 3;
    return 4 + 1/(1+n.in+n.out); };
  const lab = visible
    .filter(i=>{ const n=N[i];
      return i===sel || i===hover || up.has(i) || dn.has(i) || n.entry || (k>0.7 && (n.in+n.out)>=4) || k>1.9; })
    .sort((a,b)=>prio(a)-prio(b));
  const boxes=[];
  const overlaps=(b)=>boxes.some(o=>!(b.x1<o.x0||b.x0>o.x1||b.y1<o.y0||b.y0>o.y1));
  let drawn=0;
  for(const i of lab){
    if(drawn>=140) break;
    const p=pos.get(i), n=N[i], r=nodeR(i);
    const txt=n.short.length>26?n.short.slice(0,24)+'…':n.short;
    const w=ctx.measureText(txt).width, h=12/k;
    const forced = i===sel||i===hover||up.has(i)||dn.has(i);
    // try above, then below, then right
    const cands=[[p.x, p.y-r-3/k],[p.x, p.y+r+h],[p.x+w/2+r+4/k, p.y+h/3]];
    let placed=null;
    for(const [lx,ly] of cands){
      const b={x0:lx-w/2-2/k, x1:lx+w/2+2/k, y0:ly-h, y1:ly+2/k};
      if(forced || !overlaps(b)){ placed={lx,ly,b}; break; }
    }
    if(!placed) continue;
    boxes.push(placed.b); drawn++;
    ctx.globalAlpha=.88; ctx.fillStyle=C.s0;
    ctx.fillRect(placed.b.x0, placed.b.y0, placed.b.x1-placed.b.x0, placed.b.y1-placed.b.y0);
    ctx.globalAlpha=1;
    ctx.fillStyle = i===sel?C.focus : (up.has(i)?C.up : (dn.has(i)?C.dn : C.t2));
    ctx.fillText(txt, placed.lx, placed.ly);
  }

  // module cluster labels
  const mods=[...new Set(visible.map(i=>N[i].mod))];
  if(mods.length>1){
    ctx.textBaseline='middle';
    mods.forEach(m=>{
      const idx=visible.filter(i=>N[i].mod===m); if(!idx.length) return;
      let sx=0,sy=0,minY=1e9; idx.forEach(i=>{const p=pos.get(i); sx+=p.x; sy+=p.y; minY=Math.min(minY,p.y);});
      const x=sx/idx.length, y=minY-26/k;
      ctx.font=`600 ${12/k}px ${getComputedStyle(document.body).getPropertyValue('--sans')}`;
      const w=ctx.measureText(m).width;
      ctx.globalAlpha=.9; ctx.fillStyle=C.s1; ctx.strokeStyle=C.line; ctx.lineWidth=1/k;
      roundRect(ctx, x-w/2-6/k, y-9/k, w+12/k, 18/k, 5/k); ctx.fill(); ctx.stroke();
      ctx.globalAlpha=1; ctx.fillStyle=C.t2; ctx.textAlign='center'; ctx.fillText(m, x, y);
    });
  }
  ctx.restore();
}
function roundRect(c,x,y,w,h,r){ r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

/* ---------------- picking + interaction ---------------- */
function pick(mx,my){
  const x=(mx-tx)/k, y=(my-ty)/k;
  let best=-1, bd=1e9;
  visible.forEach(i=>{ const p=pos.get(i), r=nodeR(i)+6;
    const d=(p.x-x)**2+(p.y-y)**2; if(d<r*r && d<bd){bd=d;best=i;} });
  return best;
}
const tip=document.getElementById('tip');
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  if(dragging){ tx+=e.clientX-lastX; ty+=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; draw(); return; }
  const h=pick(e.clientX-r.left, e.clientY-r.top);
  if(h!==hover){ hover=h; draw(); }
  if(h>=0){ const n=N[h];
    tip.innerHTML=`<div class="t">${esc(n.mod)}:${esc(n.name)}</div>
      <div class="s">${esc(n.sig).slice(0,190)}</div>
      <div class="s">line ${n.line}–${n.endLine} · ${n.in} caller${n.in===1?'':'s'} · ${n.out} callee${n.out===1?'':'s'}${n.entry?' · notebook entry point':''}</div>`;
    tip.style.display='block';
    const tw=Math.min(400,tip.offsetWidth);
    tip.style.left=Math.min(e.clientX+14, innerWidth-tw-10)+'px';
    tip.style.top=Math.min(e.clientY+14, innerHeight-tip.offsetHeight-10)+'px';
  } else tip.style.display='none';
});
cv.addEventListener('mouseleave',()=>{ tip.style.display='none'; hover=-1; draw(); });
let dragging=false,lastX=0,lastY=0,moved=0;
cv.addEventListener('mousedown',e=>{dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;cv.classList.add('drag');});
addEventListener('mousemove',e=>{ if(dragging) moved+=Math.abs(e.movementX)+Math.abs(e.movementY); });
addEventListener('mouseup',e=>{
  if(dragging && moved<4){ const r=cv.getBoundingClientRect();
    const h=pick(e.clientX-r.left,e.clientY-r.top); if(h>=0) focusNode(h); else { sel=-1; renderDetail(); draw(); } }
  dragging=false; cv.classList.remove('drag');
});
cv.addEventListener('wheel',e=>{
  e.preventDefault(); const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const f=Math.exp(-e.deltaY*0.0016), nk=Math.max(0.15,Math.min(7,k*f));
  tx=mx-(mx-tx)*(nk/k); ty=my-(my-ty)*(nk/k); k=nk; draw();
},{passive:false});

document.getElementById('btn-fit').onclick=fit;
document.getElementById('btn-all').onclick=()=>{ scopeMods=MODS.map(m=>m.id); document.getElementById('scope').textContent='all 20 modules'; buildView(); draw(); };
document.getElementById('cb-orphan').onchange=e=>{ hideOrphan=!e.target.checked; buildView(); draw(); };

/* ---------------- selection ---------------- */
function selectModule(mod, rebuild){
  scopeMods=[mod];
  document.getElementById('scope').textContent=mod;
  document.querySelectorAll('.mrow').forEach(b=>b.setAttribute('aria-current', String(b.dataset.mod===mod)));
  if(rebuild){ sel=-1; buildView(); renderModuleDetail(mod); draw(); }
}
function focusNode(i){
  sel=i; const n=N[i];
  if(!visible.includes(i) || !scopeMods.includes(n.mod)){
    scopeMods=[n.mod]; document.getElementById('scope').textContent=n.mod;
    document.querySelectorAll('.mrow').forEach(b=>b.setAttribute('aria-current', String(b.dataset.mod===n.mod)));
    buildView();
  }
  renderDetail(); draw();
  const p=pos.get(i); if(p){ k=Math.max(k,1.1); tx=W/2-p.x*k; ty=H/2-p.y*k; draw(); }
}

/* ---------------- detail panel ---------------- */
const detail=document.getElementById('detail');
function renderModuleDetail(mod){
  const m=MODS.find(x=>x.id===mod);
  const fns=(byMod[mod]||[]).map(i=>N[i]).sort((a,b)=>(b.in+b.out)-(a.in+a.out)).slice(0,14);
  detail.innerHTML=`<h3>${m.id}.py</h3>
    <div style="font-size:11.5px;color:var(--text-3);margin-bottom:8px">${m.layerName}</div>
    <dl class="dl"><dt>Lines</dt><dd>${m.loc.toLocaleString()}</dd>
      <dt>Functions</dt><dd>${m.funcs}</dd><dt>Classes</dt><dd>${m.classes}</dd>
      <dt>Constants</dt><dd>${m.consts}</dd>
      <dt>Imports</dt><dd>${m.localImports.length?m.localImports.join(', '):'—'}</dd>
      <dt>Star-imports</dt><dd>${m.star.length?m.star.join(', '):'—'}</dd></dl>
    ${m.entryPoints.length?`<div class="secttl" style="padding-left:0">Called from main.ipynb (${m.entryPoints.length})</div>
      <div>${m.entryPoints.map(e=>`<span class="pill"><i style="background:var(--focus)"></i>${esc(e)}</span>`).join('')}</div>`
      :`<p class="empty">Not called from main.ipynb.</p>`}
    <div class="secttl" style="padding-left:0">Most connected functions</div>
    <ul class="lst">${fns.map(f=>`<li><button class="lnk" data-i="${idIndex[f.id]}">${esc(f.name)}<span class="m"> · ${f.in}↓ ${f.out}↑</span></button></li>`).join('')}</ul>`;
  wireLinks();
}
function renderDetail(){
  if(sel<0){ renderModuleDetail(scopeMods[0]); return; }
  const n=N[sel];
  const ups=inAdj[sel].map(i=>N[i]), dns=outAdj[sel].map(i=>N[i]);
  const list=(arr,hue)=>arr.length
    ? `<ul class="lst">${arr.map(x=>`<li><button class="lnk" data-i="${idIndex[x.id]}"><span style="color:${hue}">●</span> ${esc(x.name)}<span class="m"> · ${esc(x.mod)}</span></button></li>`).join('')}</ul>`
    : `<p class="empty">none</p>`;
  detail.innerHTML=`<h3>${esc(n.short)}</h3>
    <div style="font-size:11.5px;color:var(--text-3);margin-bottom:2px">${esc(n.mod)}.py${n.cls?` · class ${esc(n.cls)}`:''}${n.nested?' · nested':''}</div>
    ${n.entry?`<span class="pill" style="border-color:var(--focus);color:var(--focus)"><i style="background:var(--focus)"></i>main.ipynb entry point</span>`:''}
    <div class="sig">${esc(n.sig)}</div>
    ${n.doc?`<p style="font-size:11.5px;color:var(--text-2);margin:0 0 8px">${esc(n.doc)}</p>`:''}
    <dl class="dl"><dt>Lines</dt><dd>${n.line}–${n.endLine} (${n.loc})</dd>
      ${n.decorators.length?`<dt>Decorators</dt><dd>${n.decorators.map(esc).join(', ')}</dd>`:''}</dl>
    <div class="secttl" style="padding-left:0">Called by (${ups.length})</div>${list(ups,'var(--up)')}
    <div class="secttl" style="padding-left:0">Calls (${dns.length})</div>${list(dns,'var(--down)')}`;
  wireLinks();
}
function wireLinks(){ detail.querySelectorAll('.lnk').forEach(b=>b.onclick=()=>focusNode(+b.dataset.i)); }

/* ---------------- search ---------------- */
const q=document.getElementById('q'), results=document.getElementById('results');
q.addEventListener('input',()=>{
  const s=q.value.trim().toLowerCase();
  document.getElementById('searchbox').classList.toggle('hide', !s);
  document.getElementById('modbox').classList.toggle('hide', !!s);
  if(!s) return;
  const hits=N.map((n,i)=>({n,i}))
    .filter(({n})=>n.name.toLowerCase().includes(s)||n.mod.toLowerCase().includes(s))
    .sort((a,b)=>{
      const ax=a.n.short.toLowerCase().startsWith(s)?0:1, bx=b.n.short.toLowerCase().startsWith(s)?0:1;
      return ax-bx || (b.n.in+b.n.out)-(a.n.in+a.n.out);
    }).slice(0,120);
  document.getElementById('nres').textContent=hits.length;
  results.innerHTML=hits.map(({n,i})=>{
    const idx=n.name.toLowerCase().indexOf(s);
    const hl = idx>=0 ? esc(n.name.slice(0,idx))+'<mark>'+esc(n.name.slice(idx,idx+s.length))+'</mark>'+esc(n.name.slice(idx+s.length)) : esc(n.name);
    return `<button class="res" data-i="${i}"><span class="fn">${hl}</span><span class="md">${esc(n.mod)} · line ${n.line}${n.entry?' · entry':''}</span></button>`;
  }).join('') || `<p class="empty" style="padding:0 7px">No match.</p>`;
  results.querySelectorAll('.res').forEach(b=>b.onclick=()=>{ focusNode(+b.dataset.i); showTab('graph'); });
});

/* ---------------- tabs ---------------- */
function showTab(which){
  ['map','graph','table'].forEach(t=>{
    document.getElementById('t-'+t).setAttribute('aria-selected', String(t===which));
    document.getElementById('pane-'+t).classList.toggle('hide', t!==which);
  });
  if(which==='graph'){ requestAnimationFrame(()=>{ resize(); }); }
  if(which==='table') renderTable();
}
document.getElementById('t-map').onclick=()=>showTab('map');
document.getElementById('t-graph').onclick=()=>showTab('graph');
document.getElementById('t-table').onclick=()=>showTab('table');
addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}
  if(e.key==='Escape'){ q.value=''; q.dispatchEvent(new Event('input')); sel=-1; renderDetail(); draw(); } });

/* ---------------- boot ---------------- */
selectModule('boh3_dds4_utils', false);
renderModuleDetail('boh3_dds4_utils');
buildView();   // defers layout until the graph pane is first shown
</script>
</body>
